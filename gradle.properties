# Memória do daemon do Gradle. Compose + AGP são famintos; 4 GB evita
# OutOfMemory em builds limpas.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Executa módulos independentes em paralelo.
org.gradle.parallel=true

# Cache de configuração: o Gradle serializa o resultado da fase de configuração
# e reaproveita nas builds seguintes. Deixa o ciclo bem mais rápido.
org.gradle.configuration-cache=true
org.gradle.caching=true

# Estilo de código oficial do Kotlin.
kotlin.code.style=official

# NOTA: no AGP 9 várias flags viraram padrão e foram REMOVIDAS. Entre elas
# android.useAndroidX e android.defaults.buildfeatures.buildconfig — declará-las
# hoje só gera aviso de opção desconhecida. Por isso não estão aqui.
